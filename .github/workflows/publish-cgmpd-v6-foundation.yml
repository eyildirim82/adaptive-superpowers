name: Publish CG-MPD V6 foundation

on:
  push:
    branches:
      - feat/cg-mpd-v6-foundation
    paths:
      - ".cgmpd-foundation/TRIGGER"

permissions:
  contents: write

jobs:
  publish:
    if: "${{ github.event.head_commit.message == 'ci: stage CG-MPD V6 foundation' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and apply exact foundation patch
        shell: bash
        run: |
          set -euo pipefail
          cat .cgmpd-foundation/part-00 .cgmpd-foundation/part-01 .cgmpd-foundation/part-02 .cgmpd-foundation/part-03 > /tmp/foundation.patch.xz.b64
          echo "f3014b725917a31d29833504f45f584c4f8bea339252b0cc1982f3b84bfb61d0  /tmp/foundation.patch.xz.b64" | sha256sum -c -
          base64 -d /tmp/foundation.patch.xz.b64 > /tmp/foundation.patch.xz
          echo "589e9f136c302e3d7c80233f91ababbf90ae33824e324fd9c443ca65f48c832b  /tmp/foundation.patch.xz" | sha256sum -c -
          xz -dc /tmp/foundation.patch.xz > /tmp/foundation.patch
          echo "e040e7814b54b7eadba340b68835c6915b435704aa0e48bf9b1a44c0fb09f796  /tmp/foundation.patch" | sha256sum -c -
          git apply --check /tmp/foundation.patch
          git apply /tmp/foundation.patch

      - name: Verify Task 0-3 foundation GREEN surfaces
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v tests.controller-gated-mpd.test_v6_policy
          bash tests/adaptive-orchestrator/test-policy-contracts.sh
          python3 skills/controller-gated-mpd/scripts/validate_wave_profile.py skills/controller-gated-mpd/references/wave-profile-template.json
          python3 -m py_compile skills/controller-gated-mpd/scripts/policy.py skills/controller-gated-mpd/scripts/validate_wave_profile.py
          bash -n skills/controller-gated-mpd/scripts/assert_frozen_base.sh
          git diff --check

      - name: Verify later-lane contracts are still RED for the right reason
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 -m unittest -v \
            tests.controller-gated-mpd.test_prompt_handoff \
            tests.controller-gated-mpd.test_evidence_ready \
            tests.controller-gated-mpd.test_merge_train \
            > /tmp/red.log 2>&1
          rc=$?
          set -e
          cat /tmp/red.log
          test "$rc" -ne 0
          grep -q "Prompt-Handoff renderer is not implemented yet" /tmp/red.log
          grep -q "V6 READY materializer missing" /tmp/red.log
          grep -q "V6 merge train is not implemented yet" /tmp/red.log

      - name: Publish clean foundation branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers skills/controller-gated-mpd tests/controller-gated-mpd
          git commit -m "feat: establish Adaptive-native CG-MPD V6 foundation"
          git rm -r .cgmpd-foundation .github/workflows/publish-cgmpd-v6-foundation.yml
          git commit -m "chore: finalize CG-MPD V6 foundation staging"
          git push origin HEAD:feat/cg-mpd-v6-foundation
