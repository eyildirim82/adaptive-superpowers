name: Publish adaptive design docs

on:
  push:
    paths:
      - ".github/workflows/publish-design-docs.yml"

permissions:
  contents: write

jobs:
  publish-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct approved design and implementation plan
        shell: bash
        run: |
          set -euo pipefail
          cat .docs-bootstrap/part00 \
              .docs-bootstrap/part01 \
              .docs-bootstrap/part02 \
              .docs-bootstrap/part03 \
              > /tmp/docs.xz.b64
          base64 -d /tmp/docs.xz.b64 > /tmp/docs.xz

          python - <<'PY'
          from pathlib import Path
          import lzma, re

          raw = lzma.decompress(Path("/tmp/docs.xz").read_bytes()).decode("utf-8")
          matches = re.findall(r"@@FILE:(.*?)@@\n(.*?)\n@@END@@\n", raw, re.S)
          expected = {
              "2026-09-12-adaptive-superpowers-design.md":
                  Path("docs/superpowers/specs/2026-09-12-adaptive-superpowers-design.md"),
              "2026-09-12-adaptive-superpowers-implementation-plan.md":
                  Path("docs/superpowers/plans/2026-09-12-adaptive-superpowers-implementation-plan.md"),
          }
          seen = set()
          for name, content in matches:
              if name not in expected:
                  raise SystemExit(f"Unexpected file in payload: {name}")
              path = expected[name]
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content + "\n", encoding="utf-8")
              seen.add(name)
          if seen != set(expected):
              raise SystemExit(f"Missing payload files: {set(expected) - seen}")
          PY

          test -s docs/superpowers/specs/2026-09-12-adaptive-superpowers-design.md
          test -s docs/superpowers/plans/2026-09-12-adaptive-superpowers-implementation-plan.md

      - name: Commit canonical docs and remove bootstrap
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .docs-bootstrap
          rm -f .github/workflows/publish-design-docs.yml
          git add -A
          git commit -m "docs: publish canonical adaptive design and implementation plan"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main
